name: rebuild-market-index

# 插件市场索引自动维护：当 plugins/ 下的 zip 或 market/index.json 有变更时，
# 自动校验 zip 结构并重建 index.json（重算 sha256/size，保留已有元数据）。
# 也可手动触发（workflow_dispatch）。

on:
  push:
    paths:
      - "plugins/**"
      - "market/index.json"
      - "tools/rebuild_index.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild index
        run: python tools/rebuild_index.py

      - name: Commit updated index
        run: |
          git config user.name "xwork-market-bot"
          git config user.email "actions@users.noreply.github.com"
          git add market/index.json
          if git diff --cached --quiet; then
            echo "index.json 无变化，跳过提交"
          else
            git commit -m "chore: rebuild market index"
            git push
          fi
