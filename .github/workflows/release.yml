name: verify-market

# 插件市场「只校验，不改写」。
#
# 为什么不再自动重建索引（2026-10-25 变更）：
# 索引已启用 Ed25519 签名，签名是对 index.json 的**字节**算的。CI 里没有私钥，
# 一旦它重建并提交 index.json，签名立刻失效，所有客户端都会拒绝该索引。
# 因此索引的权威版本只能在签名机上产出：本地 rebuild → 本地签名 → 推送。
#
# 本工作流做三件事，任一失败就红灯：
#   1. 每个 zip 的 sha256/size 与 index.json 一致；
#   2. market/index.json.sig 存在且公钥在受信列表内；
#   3. index.json 的字节验签通过。

on:
  push:
    paths:
      - "plugins/**"
      - "market/index.json"
      - "market/index.json.sig"
      - "tools/rebuild_index.py"
      - "tools/verify_market.py"
  pull_request:
    paths:
      - "plugins/**"
      - "market/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify index & signature
        run: python tools/verify_market.py
